# RoboBun Lite 验证配置（方案书 §7.1）
# 由 /robobun-init 探测生成；本仓库验证口径与 AGENTS.md 第 6 节完成门禁一致：
# typecheck → lint → bun test --isolate（全量）。
version: 1
baseline: lazy          # lazy | off | always：验证失败时去 base 复跑失败 stage，区分预存失败
repair:
  max_rounds: 3
  stall_stop: true
stages:
  - name: install
    command: "bun install --frozen-lockfile"
    required: false
  # FISH 测试依赖本地 Postgres/MinIO 与已应用迁移（缺迁移时 88 个用例红），
  # 因此 db_prepare 是门禁的一部分，而非可选环境准备。
  # 只 wait 常驻服务（postgres/minio）：--wait 不带服务名会被一次性容器
  # minio-init 的正常退出（exit 0）误判为失败（实测 verify-2026-09-28T05-20-31）
  - name: db_prepare
    command: "docker compose up -d --wait postgres minio && bun run db:generate && bun run db:migrate && bun run db:seed"
    required: true
  - name: typecheck
    command: "bun run typecheck"
    required: true
  - name: lint
    command: "bun run lint"
    required: true
  - name: unit_test
    command: "bun test --isolate --timeout 20000"
    required: true
# 验证阶梯（优化方案 v1.1 §4）：quick = 实现过程反馈（typecheck/lint + 受影响
# workspace 的定向测试，scope 由 agent 按改动面经 ROBOBUN_TEST_SCOPE 传入）；
# quick 不覆写 latest.json、不产生验收结论；PR 前必须跑一次不带 -p 的结论性全量。
# 20s 超时是环境适应而非口径放宽：本机常驻负载下 5s 默认值会把 DB 型用例的
# 负载抖动伪装成测试失败（task-329 实测三轮，失败集合每轮不同、零断言失败）。
profiles:
  quick:
    - typecheck
    - lint
    - unit_test "bun test ${ROBOBUN_TEST_SCOPE:-./apps/web-pc} --isolate --timeout 20000"
