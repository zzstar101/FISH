# RoboBun Lite 审查配置（方案书 §8.1）
version: 1
mode: self              # self = 当前 Harness 派生全新子代理；cross = 调外部 CLI
                        # 本机未装 opencode → self（切换 cross 前先确认 cross.command 可用）
cross:
  command: "opencode run \"$(cat {prompt_file})\""
  timeout_minutes: 10
repair_gate:
  # 只有这些严重度的 finding 触发修复轮；其余记录进 PR 不阻塞（方案书 §9.1）
  trigger_severities: [critical, high]
