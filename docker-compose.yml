name: fish

# 只托管本地依赖；应用（web / api / worker）由宿主机 bun 直接运行。
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: fish
      POSTGRES_DB: fish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fish -d fish"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fish
      MINIO_ROOT_PASSWORD: fish-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # 设匿名读策略：读接口返回的图片 URL 是 `S3_PUBLIC_URL + '/' + objectKey`
    # （packages/db/src/schema/listings.ts 的注释、#6 契约 §1 的 ListingImageSchema），
    # 没有这一步时匿名 GET 会 403，前端 <img> 全部打不开。
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fish fish-secret &&
      mc mb --ignore-existing local/fish &&
      mc anonymous set download local/fish
      "

volumes:
  postgres-data:
  minio-data:
