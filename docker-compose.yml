name: fish

# 只托管本地依赖；应用（api / worker / web-pc）由宿主机 bun 直接运行。
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # 官方镜像默认 max_connections=100 不够：`bun test` 跑 47 个测试文件，其中 15 个各自建
    # 一个连接池（12 个在 afterAll 关、1 个在用例的 finally 里关，但都只在自己的文件跑完时
    # 才关），本机实测这一套下来
    # pg_stat_activity 的 client backend 峰值 ≥91（0.1s 采样；同期空闲基线 21）。
    # 只剩个位数槽位时任何额外客户端都会打满，表现为与被测代码无关的 53300
    # 「sorry, too many clients already」假失败 —— 实测：auth/router.test.ts 的
    # 「注册原子性 > 会话写入失败时回滚已创建的用户」在整套并发时撞 53300（同文件单跑
    # 16 pass / 0 fail）。`--max-concurrency=4` 压不下来（峰值同为 91）：池在文件 import
    # 阶段就建好，限测试并发不改变同时存活的池数。
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: fish
      POSTGRES_DB: fish
    ports:
      - "5432:5432"
    volumes:
      # PG18 image stores the cluster under /var/lib/postgresql/18/docker. Use a NEW
      # volume: never mount the PG16 data directory here or silently initialize an empty DB.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fish -d fish"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 镜像源：MinIO 官方已撤回免费镜像（Docker Hub `minio/minio` 仓库已删除、quay.io 同名仓库
    # 不再公开），改用社区重建的 `pgsty/minio`。与 `.github/workflows/ci.yml` 保持同一来源。见 #216。
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fish
      MINIO_ROOT_PASSWORD: fish-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # 同上：`pgsty/mc`，与 `.github/workflows/ci.yml` 保持同一来源。
    image: pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    # 仅商品图片（listings/*）公开；评价配图（reviews/*，#483 审查响应起撤出匿名直读，
    # 走短期签名代理）、聊天临时对象、上传 staging 与最终快照不允许匿名读取或列举。
    # ilm.json 是**期望态**整体导入（幂等，重复运行收敛到同一份生命周期配置）：
    # 评价配图 staging 前缀 1 天过期（confirm 幂等不依赖 staging 存活，见 docs/deployment.md）。
    volumes:
      - ./infra/minio-public-policy.json:/policies/public.json:ro
      - ./infra/minio-ilm.json:/policies/ilm.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fish fish-secret &&
      mc mb --ignore-existing local/fish &&
      mc anonymous set-json /policies/public.json local/fish &&
      mc ilm rule import local/fish < /policies/ilm.json
      "

volumes:
  postgres18-data:
  minio-data:
