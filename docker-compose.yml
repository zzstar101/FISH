name: fish

# 只托管本地依赖；应用（web / api / worker）由宿主机 bun 直接运行。
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 默认 max_connections=100 不够：`bun test` 的 47 个文件在 import 期各自 createDb()，
    # 实测峰值 96 条连接（与 dev 进程是否在跑无关，`--max-concurrency` 也压不下来）。
    # 只剩 4 个槽位时，只要再有任何客户端（如 dev:api / dev:worker 的池）就会打满，
    # 表现为与被测代码无关的 53300「sorry, too many clients already」假失败
    # （实测：auth/router.test.ts 的注册原子性用例在 migrate 阶段撞 53300）。
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: fish
      POSTGRES_DB: fish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fish -d fish"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fish
      MINIO_ROOT_PASSWORD: fish-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # 设匿名读策略：读接口返回的图片 URL 是 `S3_PUBLIC_URL + '/' + objectKey`
    # （packages/db/src/schema/listings.ts 的注释、#6 契约 §1 的 ListingImageSchema），
    # 没有这一步时匿名 GET 会 403，前端 <img> 全部打不开。
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fish fish-secret &&
      mc mb --ignore-existing local/fish &&
      mc anonymous set download local/fish
      "

volumes:
  postgres-data:
  minio-data:
