name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fish
          POSTGRES_PASSWORD: fish
          POSTGRES_DB: fish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fish -d fish"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: fish
          MINIO_ROOT_PASSWORD: fish-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fish:fish@localhost:5432/fish
      API_PORT: "3000"
      WEB_ORIGIN: http://localhost:5173
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fish
      S3_SECRET_ACCESS_KEY: fish-secret
      S3_BUCKET: fish
      S3_PUBLIC_URL: http://localhost:9000/fish

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # 桶与匿名读策略必须与 docker-compose.yml 的 minio-init 保持一致：
      # 读接口返回的图片 URL 是 `S3_PUBLIC_URL + '/' + objectKey`（#6 契约 §1 的 ListingImageSchema），
      # 少了匿名读策略，集成测试里的公开 URL 会 403。
      # `--entrypoint /bin/sh`：minio/mc 镜像的 ENTRYPOINT 是 `mc`，不覆盖的话 `sh -c` 会被当成 mc 的参数。
      - name: Init MinIO bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            -e MC_HOST_local=http://fish:fish-secret@localhost:9000 \
            minio/mc:latest -c "
              mc mb --ignore-existing local/fish &&
              mc anonymous set download local/fish
            "

      # 证据：#2 验收要求 migration 可在空库执行（走 README 记录的同一条命令）
      - name: Migrate
        run: bun run db:migrate

      - name: Test
        run: bun test
